// 2. المحرك الطبي الذهبي (MedicalEngine V10.0)
// =============================================
class MedicalEngine {
  parseUnitString(unitString) {
    let baseUnit = '', hasKg = false, timeFactor = 0;
    if (!unitString) return { baseUnit, hasKg, timeFactor };
    let u = unitString.toLowerCase();
    if (u.includes('/kg')) hasKg = true;
    if (u.includes('/min')) timeFactor = 60;
    else if (u.includes('/hr')) timeFactor = 1;
    if (u.includes('mcg')) baseUnit = 'mcg';
    else if (u.includes('mg')) baseUnit = 'mg';
    else if (u.includes('units') || u.includes('iu')) baseUnit = 'units';
    else if (u.includes('milliunits')) baseUnit = 'milliunits';
    return { baseUnit, hasKg, timeFactor };
  }
  calculateConcentration(amount, volume, unit) {
    if (volume <= 0 || amount <= 0) throw new Error("MissingData");
    return { value: amount / volume, unit: unit.toLowerCase() + '/mL' };
  }
  calculate(params) {
    let result = { rawResult: null, roundedResult: null, calculatedDose: null, warnings: [], error: null, displayMode: "" };
    try {
      const { dose, weight, unit, totalDrugAmount, totalVolume, totalDrugUnit, maxDose, isContinuous } = params;
      const conc = this.calculateConcentration(totalDrugAmount, totalVolume, totalDrugUnit);
      const doseInfo = this.parseUnitString(unit);
      const drugInfo = this.parseUnitString(totalDrugUnit);
      let unitConv = 1;
      if (doseInfo.baseUnit === 'mcg' && drugInfo.baseUnit === 'mg') unitConv = 0.001;
      else if (doseInfo.baseUnit === 'mg' && drugInfo.baseUnit === 'mcg') unitConv = 1000;
      else if (doseInfo.baseUnit === 'milliunits' && drugInfo.baseUnit === 'units') unitConv = 0.001;
      else if (doseInfo.baseUnit === 'units' && drugInfo.baseUnit === 'milliunits') unitConv = 1000;
      let weightFactor = doseInfo.hasKg ? weight : 1;
      let effectiveDose = dose * weightFactor * unitConv;
      let finalRate;
      if (isContinuous && doseInfo.timeFactor !== 0) {
        finalRate = (effectiveDose * doseInfo.timeFactor) / conc.value;
        result.displayMode = "Rate (mL/hr)";
      } else {
        finalRate = effectiveDose / conc.value;
        result.displayMode = "Dose Volume (mL)";
      }
      result.rawResult = finalRate;
      result.roundedResult = Number(finalRate.toFixed(2));
      result.calculatedDose = effectiveDose;
      if (maxDose) {
        const patientMax = maxDose * weightFactor;
        if (effectiveDose > (patientMax + 0.0001)) {
          result.warnings.push(`DANGER: Max Dose Exceeded! (Calc: ${effectiveDose.toFixed(3)}, Pt Max: ${patientMax.toFixed(3)} ${doseInfo.baseUnit})`);
        }
      }
    } catch (e) {
      result.error = e.message === "MissingData" ? "Missing Drug Amount or Volume" : e.message;
    }
    return result;
  }
  reverseBolus(params) {
    const { dose, weight, unit, totalDrugAmount, totalVolume, totalDrugUnit, maxDose, minDose } = params;
    if (!totalVolume || !totalDrugAmount) return { error: "Missing Drug Amount or Volume" };
    const doseVal = parseFloat(dose);
    const weightVal = parseFloat(weight);
    if (isNaN(doseVal) || isNaN(weightVal) || totalVolume <= 0) return { error: "Invalid inputs" };

    const doseInfo = this.parseUnitString(unit);
    const drugInfo = this.parseUnitString(totalDrugUnit);
    const weightFactor = doseInfo.hasKg ? weightVal : 1;
    const effectiveDose = doseVal * weightFactor;

    // تحويل الوحدات
    let concentration = totalDrugAmount / totalVolume;
    if (doseInfo.baseUnit === 'mcg' && drugInfo.baseUnit === 'mg') concentration *= 1000;
    else if (doseInfo.baseUnit === 'mg' && drugInfo.baseUnit === 'mcg') concentration /= 1000;

    const volumeToDraw = effectiveDose / concentration;

    let error = null;
    let warning = null;

    // صمام الأمان: فحص الحد الأعلى
    if (maxDose) {
      const patientMax = maxDose * weightFactor;
      if (effectiveDose > patientMax) {
        error = "DANGER: Max Dose Exceeded! (Calc: " + effectiveDose.toFixed(3) + ", Pt Max: " + patientMax.toFixed(3) + " " + doseInfo.baseUnit + ")";
      }
    }

    // صمام الأمان: فحص الحد الأدنى
    if (minDose) {
      const patientMin = minDose * weightFactor;
      if (effectiveDose < patientMin) {
        warning = "Low Dose Alert! (Calc: " + effectiveDose.toFixed(3) + ", Pt Min: " + patientMin.toFixed(3) + " " + doseInfo.baseUnit + ") - Renal/Hepatic Adjustment?";
      }
    }

    return { volume: volumeToDraw.toFixed(2), raw: volumeToDraw, doseGiven: effectiveDose.toFixed(3), unit: doseInfo.baseUnit, error, warning };
  }

  reverseInfusion(params) {
    const { rate, weight, unit, totalDrugAmount, totalVolume, totalDrugUnit } = params;
    if (!totalVolume || !totalDrugAmount) return { error: "Missing Drug Amount or Volume" };
    const rateVal = parseFloat(rate);
    const weightVal = parseFloat(weight);
    if (isNaN(rateVal) || isNaN(weightVal) || totalVolume <= 0) return { error: "Invalid inputs" };

    const doseInfo = this.parseUnitString(unit);
    const drugInfo = this.parseUnitString(totalDrugUnit);
    let concentration = totalDrugAmount / totalVolume;
    if (doseInfo.baseUnit === 'mcg' && drugInfo.baseUnit === 'mg') concentration *= 1000;
    else if (doseInfo.baseUnit === 'mg' && drugInfo.baseUnit === 'mcg') concentration /= 1000;

    const timeFactor = doseInfo.timeFactor;
    const actualDose = (rateVal * concentration) / (weightVal * timeFactor);

    return { dose: actualDose.toFixed(4), raw: actualDose, unit: doseInfo.baseUnit, rate: rateVal, concentration: concentration };
  }
}

function validateKey(key, deviceId) {
  if (key === 'AHMAD_MASTER_2026') return true;
  try {
    const parts = key.split('-');
    if (parts.length !== 4) return false;
    if (parts.some(p => p.length !== 4)) return false;
    const cleanKey = key.replace(/-/g, '');
    let decodedDevicePart = '';
    const shift = cleanKey.charCodeAt(0) % 16;
    for (let i = 1; i < 9; i++) {
      const charCode = cleanKey.charCodeAt(i) - shift;
      decodedDevicePart += String.fromCharCode(charCode);
    }
    return deviceId.slice(-7) === decodedDevicePart.trim().slice(-7);
  } catch (e) {
    return false;
  }
}

function renderDrugDetail() {
  const detailEl = document.getElementById('drugDetail');
  if (!detailEl) return;
  const drugs = groupedDrugs[selectedDrugName] || [];

  // تصحيح: أدوية متقطعة تعرض IV intermittent بدل IV infusion
  drugs.forEach(d => {
    if (d && !d.is_continuous && d.route && d.route.toLowerCase().includes('iv infusion')) {
      d.route = d.route.replace(/IV infusion/i, 'IV intermittent infusion');
    }
  });
  if (selectedDrug && !selectedDrug.is_continuous && selectedDrug.route && selectedDrug.route.toLowerCase().includes('iv infusion')) {
    selectedDrug.route = selectedDrug.route.replace(/IV infusion/i, 'IV intermittent infusion');
  }
  
  const ageGroups = {};
  drugs.forEach(d => {
    const age = d.age_group || 'General';
    if (!ageGroups[age]) ageGroups[age] = [];
    ageGroups[age].push(d);
  });

  const ageOrder = ['Neonate', 'Neonate/Child', 'Child 1-11 months', 'Child 1 month-11 years', 'Child 2-17 years', 'Child 3 months-17 years', 'Child 12-17 years', 'Child', 'All ages', 'General'];
  const sortedAges = Object.keys(ageGroups).sort((a, b) => {
    const idxA = ageOrder.findIndex(x => a.includes(x) || x.includes(a));
    const idxB = ageOrder.findIndex(x => b.includes(x) || x.includes(b));
    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
    if (idxA !== -1) return -1;
    if (idxB !== -1) return 1;
    return a.localeCompare(b);
  });

  const ageColors = {
    'Neonate': 'from-purple-500 to-pink-500',
    'Child': 'from-cyan-500 to-blue-500',
    'All ages': 'from-emerald-500 to-teal-500'
  };

  detailEl.classList.remove('hidden');
  detailEl.innerHTML = `
    <div class="bg-slate-800/30 backdrop-blur-sm rounded-2xl p-4 border border-slate-700/30 mb-3">
      ${selectedDrug ? `
        <div id="selectedProtocolHeader" class="flex items-center gap-3 cursor-pointer" onclick="toggleProtocolList()">
          <div class="bg-gradient-to-br from-emerald-500 to-teal-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
            <span class="text-white font-black text-sm">📋</span>
          </div>
          <div class="flex-1">
            <p class="text-white font-black text-sm">${selectedDrug.indication}</p>
            <p class="text-slate-500 text-[10px]">${selectedDrug.age_group} | ${selectedDrug.route}</p>
          </div>
          <div class="text-slate-400 text-xs">▼</div>
        </div>
        <div id="protocolList" class="hidden mt-3 space-y-2 max-h-80 overflow-y-auto scrollbar-hide">
      ` : `
        <div class="flex items-center gap-3 mb-3">
          <div class="bg-gradient-to-br from-emerald-500 to-teal-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
            <span class="text-white font-black text-sm">📋</span>
          </div>
          <div>
            <p class="text-white font-black text-sm">Select Protocol</p>
            <p class="text-slate-500 text-[10px]">${drugs.length} protocols available</p>
          </div>
        </div>
        <div id="protocolList" class="space-y-2 max-h-80 overflow-y-auto scrollbar-hide">
      `}
        ${sortedAges.map(age => {
          const colorKey = Object.keys(ageColors).find(k => age.includes(k));
          const gradient = ageColors[colorKey] || 'from-slate-500 to-slate-600';
          const sortedDrugs = ageGroups[age].sort((a,b) => a.indication.localeCompare(b.indication));
          
          return `
          <div class="bg-slate-800/50 rounded-xl overflow-hidden border border-slate-700/30">
            <div class="bg-gradient-to-r ${gradient} px-3 py-1.5 flex items-center gap-2">
              <span class="text-[9px] font-black text-white/90 uppercase tracking-widest">${age}</span>
              <span class="text-[9px] text-white/60 font-bold">${sortedDrugs.length}</span>
            </div>
            <div class="divide-y divide-slate-700/30">
              ${sortedDrugs.map((m, i) => `
                <button class="protocol-option w-full text-left px-3 py-2.5 hover:bg-slate-700/50 transition-all flex items-center gap-2"
                  data-indication="${m.indication}" data-age="${m.age_group}" data-route="${m.route}">
                  <div class="w-1.5 h-1.5 rounded-full bg-slate-600"></div>
                  <div class="flex-1"><span class="text-xs text-slate-300 font-medium leading-tight">${m.indication}</span><span class="text-[10px] text-slate-500 ml-2">${m.route}</span></div>
                </button>
              `).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div id="drugForm" class="hidden space-y-3 mt-3"></div>`;

  // دالة فتح/إغلاق القائمة
  window.toggleProtocolList = function() {
    const list = document.getElementById('protocolList');
    if (list) {
      list.classList.toggle('hidden');
    }
  };

  // ربط أحداث الاختيار
  document.querySelectorAll('.protocol-option').forEach(btn => {
    btn.addEventListener('click', function() {
      const indication = this.getAttribute('data-indication');
      const age = this.getAttribute('data-age');
      const route = this.getAttribute('data-route');
      const found = drugs.find(d => d.indication === indication && d.age_group === age && d.route === route);
      if (found) {
        selectedDrug = found;
        if (selectedDrug && !selectedDrug.is_continuous && selectedDrug.route && selectedDrug.route.toLowerCase().includes('iv infusion')) {
          selectedDrug.route = selectedDrug.route.replace(/IV infusion/i, 'IV intermittent infusion');
        }
        renderDrugForm();
        const list = document.getElementById('protocolList');
        if (list) list.classList.add('hidden');
        renderDrugDetail();
      }
    });
  });

  if (selectedDrug) renderDrugForm();
}

    ${calcMode === 'normal' ? `
<!-- ===== وضع الحساب العادي (كما هو الآن) ===== -->
<div class="grid grid-cols-2 gap-3">
  <input id="weightInput" type="number" placeholder="Weight (kg)" class="bg-[#0f172a] border border-slate-600 h-12 rounded-xl text-emerald-400 font-black px-3 outline-none focus:ring-2 focus:ring-emerald-500">

</div>
<div class="grid grid-cols-2 gap-3">
  <div class="relative">
    <input id="amountInput" type="number" placeholder="Drug Amount" class="w-full bg-[#0f172a] border border-slate-600 h-12 rounded-xl text-blue-400 font-black px-3 pr-10 outline-none focus:ring-2 focus:ring-blue-500">
    <span class="absolute right-3 top-3.5 text-[10px] font-black text-blue-500/70">${getBaseUnit(selectedDrug.unit)}</span>
  </div>
  <div class="relative">
    <input id="volumeInput" type="number" placeholder="Total Volume" class="w-full bg-[#0f172a] border border-slate-600 h-12 rounded-xl text-blue-400 font-black px-3 pr-10 outline-none focus:ring-2 focus:ring-blue-500">
    <span class="absolute right-3 top-3.5 text-[10px] font-black text-blue-500/70">ML</span>
  </div>
</div>
` : selectedDrug && selectedDrug.is_continuous ? `
<!-- ===== وضع الحساب العكسي للجرعات المستمرة ===== -->
<p class="text-[10px] font-black text-amber-400 uppercase text-center">Reverse Infusion: Enter Pump Rate → Get Actual Dose</p>
<div class="grid grid-cols-2 gap-3">
  <input id="weightInput" type="number" placeholder="Weight (kg)" class="bg-[#0f172a] border border-slate-600 h-12 rounded-xl text-emerald-400 font-black px-3 outline-none focus:ring-2 focus:ring-emerald-500">
  <input id="rateInput" type="number" placeholder="Pump Rate (mL/hr)" class="bg-[#0f172a] border border-slate-600 h-12 rounded-xl font-black px-3 outline-none focus:ring-2 focus:ring-emerald-500">
</div>
<div class="grid grid-cols-2 gap-3">
  <div class="relative">
    <input id="amountInput" type="number" placeholder="Drug Amount" class="w-full bg-[#0f172a] border border-slate-600 h-12 rounded-xl text-blue-400 font-black px-3 pr-10 outline-none focus:ring-2 focus:ring-blue-500">
    <span class="absolute right-3 top-3.5 text-[10px] font-black text-blue-500/70">${getBaseUnit(selectedDrug.unit)}</span>
  </div>
  <div class="relative">

    <span class="absolute right-3 top-3.5 text-[10px] font-black text-blue-500/70">ML</span>
  </div>
</div>
` : `
<!-- ===== وضع الحساب العكسي للجرعات المقطوعة ===== -->
<p class="text-[10px] font-black text-amber-400 uppercase text-center">Reverse Bolus: Enter Desired Dose → Get Volume to Draw</p>
<div class="grid grid-cols-2 gap-3">
  <input id="weightInput" type="number" placeholder="Weight (kg)" class="bg-[#0f172a] border border-slate-600 h-12 rounded-xl text-emerald-400 font-black px-3 outline-none focus:ring-2 focus:ring-emerald-500">
  <input id="reverseDoseInput" type="number" placeholder="Desired Dose (${getBaseUnitOnly(selectedDrug.unit)})" class="bg-[#0f172a] border border-slate-600 h-12 rounded-xl font-black px-3 outline-none focus:ring-2 focus:ring-emerald-500">
</div>
<div class="grid grid-cols-2 gap-3">
  <div class="relative">
    <input id="amountInput" type="number" placeholder="Drug Amount" class="w-full bg-[#0f172a] border border-slate-600 h-12 rounded-xl text-blue-400 font-black px-3 pr-10 outline-none focus:ring-2 focus:ring-blue-500">
    <span class="absolute right-3 top-3.5 text-[10px] font-black text-blue-500/70">${getBaseUnit(selectedDrug.unit)}</span>
  </div>
  <div class="relative">
    <input id="volumeInput" type="number" placeholder="Total Volume" class="w-full bg-[#0f172a] border border-slate-600 h-12 rounded-xl text-blue-400 font-black px-3 pr-10 outline-none focus:ring-2 focus:ring-blue-500">

  </div>

`}
    <p id="doseWarningMsg" class="text-[10px] font-black text-center uppercase hidden"></p>
    <button id="calcBtn" class="w-full h-14 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-lg uppercase tracking-widest rounded-xl shadow-lg">⚕️ CALCULATE</button>
    <button id="clearBtn" class="w-full h-10 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold text-sm uppercase tracking-widest rounded-xl mt-2 transition-all">✕ Clear Fields</button>`;

  // ربط أزرار التبديل
  document.getElementById('normalModeBtn').addEventListener('click', function() {

    this.className = 'flex-1 py-2 text-xs font-black rounded-lg bg-emerald-600 text-white uppercase tracking-wider';
    document.getElementById('reverseModeBtn').className = 'flex-1 py-2 text-xs font-black rounded-lg bg-slate-700 text-slate-400 uppercase tracking-wider';
    renderDrugForm();
  });
  document.getElementById('reverseModeBtn').addEventListener('click', function() {
    calcMode = 'reverse';
    this.className = 'flex-1 py-2 text-xs font-black rounded-lg bg-emerald-600 text-white uppercase tracking-wider';
    document.getElementById('normalModeBtn').className = 'flex-1 py-2 text-xs font-black rounded-lg bg-slate-700 text-slate-400 uppercase tracking-wider';
    renderDrugForm();
  });

  const doseInput = document.getElementById('doseInput');
  const calcBtn = document.getElementById('calcBtn');
  const warningMsg = document.getElementById('doseWarningMsg');

  if (calcBtn) {
  calcBtn.addEventListener('click', ()=>{
    const weight = parseFloat(document.getElementById('weightInput').value);
    const amount = parseFloat(document.getElementById('amountInput').value) || 0;
    const volume = parseFloat(document.getElementById('volumeInput').value) || 0;

    if (calcMode === 'reverse') {
      // ===== وضع الحساب العكسي =====
      if (!selectedDrug) return;
      if (!weight || !amount || !volume) return;

      let reverseResult;
      if (selectedDrug.is_continuous) {
        // عكسي للجرعات المستمرة: Rate → Dose
        const rate = parseFloat(document.getElementById('rateInput').value);
        if (!rate) return;
        reverseResult = engine.reverseInfusion({
          rate, weight, unit: selectedDrug.unit,
          totalDrugAmount: amount, totalVolume: volume, totalDrugUnit: selectedDrug.unit
        });
        if (!reverseResult.error) {
          showResults({
            calculatedDose: parseFloat(reverseResult.dose),
            displayMode: 'Actual Dose',
            roundedResult: parseFloat(reverseResult.dose),
            rawResult: reverseResult.raw,
            warnings: []
          }, weight, reverseResult.dose);
        } else {
          showResults({ error: reverseResult.error }, weight, 0);
        }
      } else {
        // عكسي للجرعات المقطوعة: Dose → Volume
        const reverseDoseInput = document.getElementById('reverseDoseInput');
        const desiredDose = parseFloat(reverseDoseInput.value);
        if (!desiredDose) return;

        // التحقق من الجرعة قبل الحساب (مطابق للحاسبة العادية)
        const reverseDoseWarningMsg = document.getElementById('doseWarningMsg');
        reverseDoseInput.classList.remove('shake','pulse-yellow','border-red-500','ring-2','ring-red-500','border-amber-500','ring-amber-500');
        if (reverseDoseWarningMsg) reverseDoseWarningMsg.classList.add('hidden');

        if (selectedDrug.max_dose && desiredDose > selectedDrug.max_dose) {
          reverseDoseInput.classList.add('shake','border-red-500','ring-2','ring-red-500');
          if (reverseDoseWarningMsg) {
            reverseDoseWarningMsg.classList.remove('hidden');
            reverseDoseWarningMsg.textContent = "DANGER: Dose exceeds Max! (Max: " + selectedDrug.max_dose + " " + selectedDrug.unit + ")";
            reverseDoseWarningMsg.className = 'text-[10px] font-black text-center uppercase text-red-400 mt-2';
          }
          playBeep('error');
          return;
        } else if (selectedDrug.min_dose && desiredDose < selectedDrug.min_dose) {
          reverseDoseInput.classList.add('pulse-yellow','border-amber-500','ring-2','ring-amber-500');
          if (reverseDoseWarningMsg) {
            reverseDoseWarningMsg.classList.remove('hidden');
            reverseDoseWarningMsg.textContent = "Low Dose Alert (Min: " + selectedDrug.min_dose + " " + selectedDrug.unit + ")";
            reverseDoseWarningMsg.className = 'text-[10px] font-black text-center uppercase text-amber-400 mt-2';
          }
          playBeep('warning');
        }

        reverseResult = engine.reverseBolus({
          dose: desiredDose, weight, unit: selectedDrug.unit,
          totalDrugAmount: amount, totalVolume: volume, totalDrugUnit: selectedDrug.unit,
          maxDose: selectedDrug.max_dose, minDose: selectedDrug.min_dose
        });

        if (reverseResult.error) {
          // عرض الخطأ كرسالة حمراء
          showResults({ error: reverseResult.error }, weight, desiredDose);
        } else {
          showResults({
            calculatedDose: parseFloat(reverseResult.doseGiven),
            displayMode: 'Dose Volume (mL)',
            roundedResult: parseFloat(reverseResult.volume),
            rawResult: reverseResult.raw,
            warnings: reverseResult.warning ? [reverseResult.warning] : []
          }, weight, desiredDose);
        }
      }
    } else {
      // ===== وضع الحساب العادي (الكود القديم يبقى كما هو) =====
      const dose = parseFloat(doseInput.value);
      if (!weight || !dose) return;

      doseInput.classList.remove('shake','pulse-yellow','border-red-500','ring-2','ring-red-500','border-amber-500','ring-amber-500');
      warningMsg.classList.add('hidden');

      if (dose > selectedDrug.max_dose) {
        doseInput.classList.add('shake','border-red-500','ring-2','ring-red-500');
        warningMsg.classList.remove('hidden');
        warningMsg.textContent = `⚠️ تجاوز الحد الأعلى المسموح (Max: ${selectedDrug.max_dose} ${selectedDrug.unit})`;
        warningMsg.className = 'text-[10px] font-black text-center uppercase text-red-400 mt-2';
        playBeep('error');
        return;
      } else if (dose < selectedDrug.min_dose) {
        doseInput.classList.add('pulse-yellow','border-amber-500','ring-2','ring-amber-500');
        warningMsg.classList.remove('hidden');
        warningMsg.textContent = `💡 جرعة منخفضة عن الحد الأدنى المعتاد (Min: ${selectedDrug.min_dose}) - Renal/Hepatic Adjustment?`;
        warningMsg.className = 'text-[10px] font-black text-center uppercase text-amber-400 mt-2';
        playBeep('warning');
      }

      const result = engine.calculate({
        dose, weight, unit: selectedDrug.unit,
        totalDrugAmount: amount, totalVolume: volume, totalDrugUnit: selectedDrug.unit,
        maxDose: selectedDrug.max_dose, isContinuous: selectedDrug.is_continuous
      });

      showResults(result, weight, dose);
      historyLog.unshift({ id: Date.now().toString(), timestamp: new Date().toLocaleTimeString(), drugName: selectedDrug.drug_name, indication: selectedDrug.indication, weight: String(weight), dose: String(dose), result: result.roundedResult?.toString()||'', unit: result.displayMode });
      historyLog = historyLog.slice(0,20); saveHistory();
    }
  });
}

  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('weightInput').value = '';
    const d = document.getElementById('doseInput'); if(d) d.value = '';
    const r = document.getElementById('rateInput'); if(r) r.value = '';
    const rd = document.getElementById('reverseDoseInput'); if(rd) rd.value = '';
    document.getElementById('amountInput').value = '';
    document.getElementById('volumeInput').value = '';
    document.getElementById('resultsPanel').classList.add('hidden');
    document.getElementById('placeholderPanel').classList.remove('hidden');
    const warningMsg = document.getElementById('doseWarningMsg');
    if (warningMsg) warningMsg.classList.add('hidden');
  });
}

function showResults(result, weight, dose) {
  document.getElementById('placeholderPanel').classList.add('hidden');
  document.getElementById('historyPanel').classList.add('hidden');
  const panel = document.getElementById('resultsPanel');
  panel.classList.remove('hidden');
  if (result.error) { panel.innerHTML = `<div class="p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 font-bold">⚠️ ${result.error}</div>`; return; }
const noteText = selectedDrug?.display_note || '';
  const freqMatch = noteText.match(/(every\s+[\d\-]+\s*h(?:ours?)?|q\d+h|[\d\-]+\s*times?\s*(?:a|per)?\s*day|once daily|twice daily|three times a day|bid|tid|qid|every\s+\d+\s*hours?)/i);
  const frequencyText = freqMatch ? freqMatch[0] : (noteText ? noteText.split('.')[0].trim() : 'As prescribed');
  const divMatch = noteText.match(/in\s+(\d+)\s+divided\s+doses/i);
  const divCount = divMatch ? parseInt(divMatch[1]) : null;
  const isTotal = divCount !== null;
  const singleDoseVal = isTotal ? (result.calculatedDose / divCount).toFixed(3) : result.calculatedDose?.toFixed(3);
  const isReverse = calcMode === 'reverse';
  const calculatedDoseDisplay = result.calculatedDose?.toFixed(4) || '0';
  
  panel.innerHTML = `
    ${isTotal ? `<div class="p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl text-amber-400 text-sm font-bold mb-4">⚠️ Total daily dose (÷${divCount}) = Single dose: ${singleDoseVal} ${getBaseUnitOnly(selectedDrug.unit)}</div>` : ''}
    <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 space-y-4">
      ${isReverse && selectedDrug.is_continuous ? `
      <div class="bg-slate-900 p-4 rounded-xl border-l-4 border-blue-500">
        <span class="text-[10px] font-black text-blue-400 uppercase">Reverse Calculated Dose</span>
        <div class="text-2xl font-black text-white">
          ${calculatedDoseDisplay} <span class="text-sm font-normal text-slate-300">${selectedDrug.unit}</span>
        </div>
      </div>
      ` : `
      <div class="bg-slate-900 p-4 rounded-xl border-l-4 border-blue-500">
        <span class="text-[10px] font-black text-blue-400 uppercase">Calculated Dose</span>
        <div class="text-2xl font-black text-white">${singleDoseVal} <span class="text-sm text-slate-300">${getBaseUnitOnly(selectedDrug.unit)}</span></div>
      </div>
      `}
      <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 mb-2">
        <span class="text-[9px] font-black text-slate-500 uppercase">Formula</span>
        <p class="text-[10px] text-slate-400 font-mono mt-1">
          Dose × Weight = ${result.calculatedDose.toFixed(2)} ${getBaseUnitOnly(selectedDrug.unit)}
        </p>
      </div>
${selectedDrug.is_continuous ? (isReverse ? '' : `
  <div class="bg-slate-900 p-4 rounded-xl border-l-4 border-emerald-500">
    <span class="text-[10px] font-black text-emerald-400 uppercase">${result.displayMode}</span>
    <div class="flex items-center justify-between">
      <div class="text-3xl font-black text-emerald-400">${result.roundedResult} <span class="text-lg text-slate-300">${result.displayMode.includes('Rate')?'mL/hr':'mL'}</span></div>
      <div class="text-right"><span class="block text-[8px] text-slate-500 font-mono">RAW</span><span class="text-[10px] font-mono text-emerald-600 font-bold">${result.rawResult?.toFixed(8)}</span></div>
    </div>
  </div>
`) : (selectedDrug.route.toLowerCase().includes('iv') || selectedDrug.route.toLowerCase().includes('intravenous') || selectedDrug.route.toLowerCase().includes('injection') ? `
  <div class="bg-slate-900 p-4 rounded-xl border-l-4 border-emerald-500 mt-3">
    <span class="text-[10px] font-black text-emerald-400 uppercase">${isReverse ? 'Volume to Draw' : 'Volume to Administer'}</span>
    <div class="flex items-center justify-between">
      <div class="text-3xl font-black text-emerald-400">${result.roundedResult} <span class="text-lg text-slate-300">mL</span></div>
      <div class="text-right"><span class="block text-[8px] text-slate-500 font-mono">RAW</span><span class="text-[10px] font-mono text-emerald-600 font-bold">${result.rawResult?.toFixed(8)}</span></div>
    </div>
  </div>
  <div class="grid grid-cols-2 gap-3 mt-2">
    <div class="bg-slate-900 p-3 rounded-xl border-l-4 border-amber-500">
      <span class="text-[10px] font-black text-amber-400 uppercase">Route</span>
      <p class="text-sm text-slate-300 font-medium mt-1">${selectedDrug.route}</p>
    </div>
    <div class="bg-slate-900 p-3 rounded-xl border-l-4 border-blue-500">
      <span class="text-[10px] font-black text-blue-400 uppercase">Frequency</span>
      <p class="text-sm text-slate-300 font-medium mt-1">${selectedDrug.display_note || 'As prescribed'}</p>
    </div>
  </div>
` : `
  <div class="grid grid-cols-2 gap-3 mt-2">
    <div class="bg-slate-900 p-3 rounded-xl border-l-4 border-amber-500">
      <span class="text-[10px] font-black text-amber-400 uppercase">Route</span>
      <p class="text-sm text-slate-300 font-medium mt-1">${selectedDrug.route}</p>
    </div>
    <div class="bg-slate-900 p-3 rounded-xl border-l-4 border-blue-500">
      <span class="text-[10px] font-black text-blue-400 uppercase">Frequency</span>
      <p class="text-sm text-slate-300 font-medium mt-1">${selectedDrug.display_note || 'As prescribed'}</p>
    </div>
  </div>
`)}
      ${(result.warnings||[]).map(w=>`<div class="bg-red-600 p-4 rounded-xl shadow-lg animate-pulse text-white font-black text-sm uppercase">⚠️ ${w}</div>`).join('')}
    </div>`;
}

const auditBtnEl2 = document.getElementById('auditBtn');
if (auditBtnEl2) {
auditBtnEl2.addEventListener('click', async () => {
  const errors = [];
  const warnings = [];
  const testWeight = 10;
  
  for (const med of medications) {
    const midDose = (med.min_dose + med.max_dose) / 2;
    
    try {
      const r = engine.calculate({
        dose: midDose, weight: testWeight, unit: med.unit,
        totalDrugAmount: 1000, totalVolume: 50, totalDrugUnit: med.unit,
        maxDose: med.max_dose, isContinuous: med.is_continuous
      });
      
      if (r.rawResult === null || isNaN(r.rawResult)) {
        errors.push(`❌ ${med.drug_name} | NaN result`);
      } else if (!isFinite(r.rawResult)) {
        errors.push(`❌ ${med.drug_name} | Infinity`);
      }
      
      if (r.displayMode === '' || r.displayMode === null) {
        errors.push(`❌ ${med.drug_name} | Empty displayMode`);
      }
      
      const overDose = med.max_dose * 2;
      const r2 = engine.calculate({
        dose: overDose, weight: testWeight, unit: med.unit,
        totalDrugAmount: 1000, totalVolume: 50, totalDrugUnit: med.unit,
        maxDose: med.max_dose, isContinuous: med.is_continuous
      });
      if (r2.warnings.length === 0 && med.max_dose > 0) {
        warnings.push(`⚠️ ${med.drug_name}: Should warn on overdose`);
      }
    } catch(e) {
      errors.push(`❌ ${med.drug_name} | Exception: ${e.message}`);
    }
  }
  
  let report = `=== AUDIT REPORT ===\n\nTotal: ${medications.length} drugs\nErrors: ${errors.length}\nWarnings: ${warnings.length}\n\n`;
  if (errors.length > 0) report += `--- ERRORS ---\n${errors.join('\n')}\n\n`;
  if (warnings.length > 0) report += `--- WARNINGS ---\n${warnings.join('\n')}\n\n`;
  if (errors.length === 0 && warnings.length === 0) report += `✅ ALL ${medications.length} MEDICATIONS PASSED!\n`;
  
  alert(report);
  console.log(report);
});
}
